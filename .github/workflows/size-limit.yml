name: "Bundle Size check @excalidraw/excalidraw"
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: candidate
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Build baseline and candidate package assets
        run: |
          for tree in baseline candidate; do
            (cd "$tree" && yarn install --frozen-lockfile)
            (cd "$tree/packages/excalidraw" && node ../../scripts/buildPackage.js)
          done
      - name: Compare gzip sizes against budgets and existing baseline excess
        run: node candidate/scripts/check-package-size.mjs baseline/packages/excalidraw/dist/prod candidate/packages/excalidraw/dist/prod >> "$GITHUB_STEP_SUMMARY"
